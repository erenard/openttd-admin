 */

plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

// The library version is the OpenTTD release this protocol targets, i.e.
// GameVersion.OPENTTD. It is deliberately not project.version: the java-library jar
// would then be renamed openttd-admin-15.3.jar, and ../strategyboard/lib and
// ../openttd-robot expect exactly openttd-admin.jar (see AGENTS.md publishing).
ext.libraryVersion = '15.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'com.google.code.gson:gson:2.2.2'
    api 'log4j:log4j:1.2.17'
    api 'org.slf4j:slf4j-api:1.6.6'
    api 'org.slf4j:slf4j-log4j12:1.6.6'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:31.0.1-jre'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
    // The server-backed tests are a separate ladder: they need a running
    // OpenTTD server, see the integrationTest task and AGENTS.md.
    filter.excludeTestsMatching('*IntegrationTest')
}

// Admin protocol against a real dedicated server. Prerequisites:
//   mkdir -p openttd/game && gradle buildGameScript
//   openttd -D -d 9,console=1,sprite=0,grf=0,sl=0 -c openttd/openttd.cfg
tasks.register('integrationTest', Test) {
    description = 'Runs the *IntegrationTest suite against a real OpenTTD server.'
    group = 'verification'
    useJUnitPlatform()
    dependsOn 'testClasses'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter.includeTestsMatching('*IntegrationTest')
    // OpenttdClientIntegrationTest joins the game port with a stale
    // TcpGame.PacketGameType, which makes the server crash (NETWORK_ERROR_WRONG_REVISION
    // leads to NOT_REACHED), so it stays out of this ladder.
    filter.excludeTestsMatching('com.openttd.client.OpenttdClientIntegrationTest')
}

task buildGameScript(type: Exec, dependsOn: 'compileJava') {
    workingDir "src/squirrel"
    commandLine 'python', 'make_tar.py'
}

// Go port (src/go): module com.openttd, go 1.27, stdlib only. go is /usr/bin/go,
// so tools/env.sh (JDK/Gradle/python) is not needed for these tasks.
task goVet(type: Exec) {
    description = 'Vets and compiles the Go port (go vet com.openttd/...).'
    group = 'build'
    workingDir 'src/go'
    commandLine 'go', 'vet', './...'
}

// Packages the Go library as a versioned tarball of the module source: a Go library
// ships as source, so consumers need the whole tree (go.mod, packages, tests).
task goPackage(type: Tar, dependsOn: 'goVet') {
    description = "Packs the Go port into build/libs/openttd-admin-go-${project.libraryVersion}.tgz."
    group = 'build'
    from 'src/go'
    archiveBaseName = 'openttd-admin-go'
    archiveVersion = project.libraryVersion
    compression = Compression.GZIP
    destinationDirectory = file("$buildDir/libs")
}

sourceSets {
    main {
         java {
            srcDirs = ['src/java']
         }
         resources {
            srcDirs = ['src/squirrel']
         }
    }

    test {
        java {
            srcDirs = ['test/java']
        }
        resources {
            srcDirs = ['test/resources', 'openttd']
        }
    }
}
